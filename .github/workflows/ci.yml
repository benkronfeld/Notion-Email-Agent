# CI: lint, format check, type check, and the full test suite against a Postgres 16 service
# container (spec §2.2, §2.3.3).
#
# NOTE: this repository currently has no git remote, so this workflow has never run and its
# correctness has NOT been verified. It is written to the spec's shape so it works the
# moment the project is pushed.
#
# Constraint 5: no job here reaches a live Notion, Gmail, or DeepSeek endpoint. The test
# suite uses the fakes in tests/fixtures/fakes.py; the only external service is the
# throwaway Postgres below. No repository secret is referenced.

name: CI

on:
  push:
  pull_request:
  workflow_dispatch:

# A superseded push does not need to finish.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint-type-test:
    name: lint, type-check, tests
    runs-on: ubuntu-latest
    timeout-minutes: 15

    # Same image and credentials as docker-compose.yml, so "green in CI" and "green
    # locally" mean the same thing.
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_DB: notion_agent_test
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d notion_agent_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    env:
      # The integration suite reads TEST_DATABASE_URL only; it never falls back to
      # DATABASE_URL (tests/fixtures/db.py). Both point at the service container above,
      # which is the only database CI may touch (constraint 1).
      TEST_DATABASE_URL: postgresql+psycopg://postgres:postgres@localhost:5432/notion_agent_test
      # Set for anything that imports app.config without building Settings explicitly.
      # Unit tests build their own Settings with explicit values and never read this.
      DATABASE_URL: postgresql+psycopg://postgres:postgres@localhost:5432/notion_agent_test

    steps:
      - name: Check out
        uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          # Pinned so a lockfile generated by one uv version is not resolved by another.
          version: "0.12.2"
          enable-cache: true

      - name: Install dependencies
        run: uv sync --frozen

      - name: Lint
        run: uv run --frozen ruff check

      - name: Check formatting
        run: uv run --frozen ruff format --check

      - name: Type-check
        run: uv run --frozen mypy

      - name: Apply migrations
        # The integration suite needs the §2.3.5 schema, so Alembic runs first. This step
        # requires the `migrations/` versions directory (a build-phase-1 deliverable) to
        # exist; until it does, this step is the one that fails, not the test suite.
        run: uv run --frozen alembic upgrade head

      - name: Test
        run: uv run --frozen pytest
